[versions]
jdk = "25"

minecraft = "26.3"
fabric-loom = "1.19-SNAPSHOT"

kotlin = "2.4.20"

liquidbounce = "0.42.0+26.3"

polyglot = "25.5.5.0.3"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
liquidbounce = { group = "net.ccbluex", name = "liquidbounce", version.ref = "liquidbounce" }

polyglot = { group = "org.graalvm.polyglot", name = "polyglot", version.ref = "polyglot" }
polyglot-tools = { group = "org.graalvm.polyglot", name = "tools-community", version.ref = "polyglot" }
polyglot-js = { group = "org.graalvm.polyglot", name = "js-community", version.ref = "polyglot" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
