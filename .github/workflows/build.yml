name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setting up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: liquidbounce-scriptapi
          path: build/libs/*.jar

      - name: Publish snapshot release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }
          NOTES="Automatic build of \`${GITHUB_SHA::7}\` from \`main\`.

          Not a stable release - it tracks whatever is on main right now."

          # Recreate rather than edit: `gh release upload --clobber` cannot retarget the tag when
          # main has moved on.
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot "$JAR" \
            --title "Snapshot" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Attach jar to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }

          # The tag names the version the jar was built as, e.g. v1.0.0+26.3
          TAG="${{ github.event.release.tag_name }}"
          case "$JAR" in
            *"-${TAG#v}.jar") ;;
            *) echo "[ERROR] $JAR does not match the tag $TAG, check mod_version and minecraft" >&2; exit 1 ;;
          esac

          gh release upload "$TAG" "$JAR" --clobber

      - name: Publish to the marketplace
        if: github.event_name == 'release' && !github.event.release.prerelease && vars.MARKETPLACE_ITEM_ID != ''
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ITEM_ID: ${{ vars.MARKETPLACE_ITEM_ID }}
          VERSION: ${{ github.event.release.tag_name }}
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          set -euo pipefail

          JAR=$(find build/libs -name '*.jar' -not -name '*-sources.jar' | head -n1)
          [ -n "$JAR" ] || { echo "[ERROR] no jar in build/libs" >&2; exit 1; }

          # The client unpacks a revision and expects exactly one jar at its root.
          zip -j addon.zip "$JAR"

          # --form-string: -F would read a release body starting with @ as a file path.
          curl --fail-with-body -X POST \
            "https://api.liquidbounce.net/api/v3/marketplace/$ITEM_ID/revisions" \
            -H "Authorization: Bearer $API_TOKEN" \
            -F "file=@addon.zip" \
            --form-string "version=$VERSION" \
            --form-string "changelog=$CHANGELOG"

  gametest:
    runs-on: ubuntu-latest
    # A client that fails to start or hangs must not hold the runner for hours
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setting up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # The game renders through Mesa's EGL, and the client's browser probes EGL as well.
      - name: Install Xvfb and EGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libegl-mesa0
      - name: Run game tests
        env:
          # Minecraft asks for an sRGB framebuffer, which Xvfb's GLX does not offer
          SDL_VIDEO_FORCE_EGL: 1
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest

      - name: Upload game test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest
          path: |
            build/run/clientGameTest/scriptapi-gametest.json
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/latest.log
          if-no-files-found: ignore

  # Every push to main that changes a script publishes it as a new marketplace revision, once the
  # game tests have run it.
  publish-scripts:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: gametest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: nes_emulator
            item-id: ${{ vars.NES_EMULATOR_ITEM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish to the marketplace
        if: matrix.item-id != ''
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ITEM_ID: ${{ matrix.item-id }}
          DIR: examples/${{ matrix.script }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # A manual run publishes every script, and so does a push whose previous tip is unknown: a
          # new branch has none, and a force-push can leave it unreachable.
          RANGE="-1"
          if [ "$GITHUB_EVENT_NAME" = push ] && git fetch --quiet origin "$BEFORE" 2>/dev/null; then
            if git diff --quiet "$BEFORE" HEAD -- "$DIR"; then
              echo "$DIR did not change"
              exit 0
            fi
            RANGE="$BEFORE..HEAD"
          fi

          # This run can finish after a newer push; that one publishes the newer script instead.
          git fetch --quiet origin main
          if [ "$(git rev-parse "HEAD:$DIR")" != "$(git rev-parse "FETCH_HEAD:$DIR")" ]; then
            echo "$DIR changed again on main"
            exit 0
          fi

          VERSION=$(sed -n 's/^ *version: *"\([^"]*\)".*/\1/p' "$DIR/main.js" | head -n1)
          [ -n "$VERSION" ] || { echo "[ERROR] no version in $DIR/main.js" >&2; exit 1; }
          CHANGELOG=$(git log --format='- %s' $RANGE -- "$DIR")

          # The client runs the main.js at the root of a revision.
          git archive --format=zip -o script.zip "HEAD:$DIR"

          curl --fail-with-body -X POST \
            "https://api.liquidbounce.net/api/v3/marketplace/$ITEM_ID/revisions" \
            -H "Authorization: Bearer $API_TOKEN" \
            -F "file=@script.zip" \
            --form-string "version=v$VERSION+${GITHUB_SHA::7}" \
            --form-string "changelog=$CHANGELOG"
